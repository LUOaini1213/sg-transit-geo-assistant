server {
    # unprivileged nginx image: the worker runs as uid 101 and cannot bind ports below 1024
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # Response headers for the page and the proxied API. "always" adds them to error responses too.
    # The map style, tiles, glyphs and sprites come from tiles.openfreemap.org; MapLibre runs its worker from a blob: URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;  # a local model can take a while on the first question
    }
    location = /docs {
        # FastAPI's Swagger page loads its script and stylesheet from cdn.jsdelivr.net and runs an inline script
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://api:8000;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
