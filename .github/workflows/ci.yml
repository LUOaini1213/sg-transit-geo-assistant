name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests on the fixture database
        run: python -m pytest -q backend/tests
      - name: Mutation check (every planted bug must fail a test)
        run: python backend/tests/mutate.py
      # The evaluation needs the full data and a model, so it runs locally (eval/run_eval.py); CI checks the file parses
      - name: Question set parses
        run: python -c "import json; [json.loads(l) for l in open('eval/questions.jsonl', encoding='utf-8') if l.strip()]"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      - name: Start the stack on the fixture and call it through nginx
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 2; done
          curl -fs http://localhost:8080/api/health
          curl -fs -X POST http://localhost:8080/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "How many bus stops are there in Alpha?", "engine": "template"}' | tee answer.json
          python3 -c "import json; a = json.load(open('answer.json')); assert a['status'] == 'answered' and a['rows'] == [[5]], a"
      - if: always()
        run: docker compose logs && docker compose down
